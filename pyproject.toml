[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sujan5655", email = "chaudharysujan5655@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.4.0",
    "fastapi>=0.163.1",
    "groq>=1.7.0",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.3.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
